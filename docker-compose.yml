# WhatsFlow — Docker Compose para Raspberry Pi (ARM64) ou qualquer Linux.
#
# Uso:
#   1) Copie .env.example → .env e configure as variáveis.
#   2) sudo docker compose up -d --build
#   3) Acesse http://<ip-do-servidor>/
#
# Volumes persistentes:
#   - ./data/db/       → banco SQLite
#   - ./data/wa_auth/  → sessão WhatsApp (evita re-scan de QR)
#   - ./data/uploads/  → uploads
#
# Para atualizar após um `git pull`:
#   sudo docker compose up -d --build
#
# Para reset completo (mantém DB e sessão WhatsApp):
#   sudo docker compose down
#   sudo docker compose up -d --build --force-recreate

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: whatsflow-backend
    restart: unless-stopped
    environment:
      SQLITE_PATH: /data/db/whatsflow.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Rithi0518@}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      WHATSAPP_SERVICE_URL: http://whatsapp:3001
      MONGO_URL: mongodb://mongo:27017  # unused but referenced by env.py
      DB_NAME: whatsflow
    volumes:
      - ./data/db:/data/db
      - ./data/uploads:/app/backend/uploads
    depends_on:
      - whatsapp
    ports:
      - "8001:8001"
    networks: [wfnet]

  whatsapp:
    build:
      context: .
      dockerfile: whatsapp-service/Dockerfile
    container_name: whatsflow-wa
    restart: unless-stopped
    volumes:
      - ./data/wa_auth:/app/whatsapp-service/.wwebjs_auth
      - ./data/wa_cache:/app/whatsapp-service/.wwebjs_cache
    ports:
      - "3001:3001"
    networks: [wfnet]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost}
    container_name: whatsflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [wfnet]

networks:
  wfnet:
    driver: bridge
